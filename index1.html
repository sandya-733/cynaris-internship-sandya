<!doctype html>
<html lang="en">
  <head>
    <title>CSS-Flexbox & Grid Layout</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: light;
        --ink: #38354a;
        --muted: #77748a;
        --lavender: #eee9ff;
        --pink: #fff0f2;
        --mint: #e5f5ee;
        --peach: #fff0df;
        --blue: #e8f2ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        background: linear-gradient(
          135deg,
          #faf7ff 0%,
          #fff8f4 52%,
          #f1faf7 100%
        );
        color: var(--ink);
        font-family: Arial, sans-serif;
        line-height: 1.6;
      }
      .page {
        width: min(100%, 1000px);
        margin: 0 auto;
      }
      .site-header {
        padding: 34px 24px 24px;
        text-align: center;
      }
      h1 {
        margin: 0;
        color: #51476f;
        font-size: clamp(2rem, 5vw, 3.2rem);
        letter-spacing: -0.04em;
        line-height: 1.15;
      }
      .intro {
        max-width: 560px;
        margin: 14px auto 22px;
        color: var(--muted);
        font-size: 1.05rem;
      }
      nav ul {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      nav a {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        color: #5b5570;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        transition:
          background-color 160ms ease,
          transform 160ms ease;
      }
      nav a:hover,
      nav a:focus-visible {
        background: var(--lavender);
        transform: translateY(-2px);
      }
      main {
        display: grid;
        gap: 24px;
      }
      .example-card {
        padding: clamp(20px, 4vw, 32px);
        border: 1px solid rgba(98, 83, 132, 0.08);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 12px 35px rgba(74, 62, 103, 0.08);
      }
      .section-heading {
        margin: 0 0 18px;
        color: #51476f;
        font-size: 1.35rem;
        text-align: center;
      }
      .flex-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 16px;
      }
      .flex-item {
        display: grid;
        min-height: 120px;
        flex: 1 1 180px;
        max-width: 260px;
        place-items: center;
        padding: 24px 20px;
        border-radius: 18px;
        background: var(--mint);
        color: #365b51;
        font-size: 1.05rem;
        font-weight: 700;
        text-align: center;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }
      .flex-item:nth-child(2) {
        background: var(--pink);
        color: #80515d;
      }
      .flex-item:nth-child(3) {
        background: var(--lavender);
        color: #594f78;
      }
      .flex-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 18px rgba(74, 62, 103, 0.12);
      }
      .grid-container {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .grid-item {
        display: grid;
        min-height: 110px;
        place-items: center;
        padding: 18px;
        border-radius: 16px;
        background: var(--blue);
        color: #45617e;
        font-size: 1.05rem;
        font-weight: 700;
        text-align: center;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }
      .grid-item:nth-child(2) {
        background: var(--peach);
        color: #745b39;
      }
      .grid-item:nth-child(3) {
        background: var(--mint);
        color: #365b51;
      }
      .grid-item:nth-child(4) {
        background: var(--pink);
        color: #80515d;
      }
      .grid-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 18px rgba(74, 62, 103, 0.12);
      }
      footer {
        padding: 26px 12px 8px;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }
      footer p {
        margin: 0;
      }
      @media (max-width: 640px) {
        body {
          padding: 18px 14px;
        }
        .site-header {
          padding: 24px 8px 20px;
        }
        .grid-container {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 360px) {
        .grid-container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <h1>CSS Flexbox &amp; Grid Layout</h1>
        <p class="intro">
          A simple, responsive look at two ways to arrange content with CSS.
        </p>
        <nav aria-label="Main Navigation">
          <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#flexbox">Flexbox</a></li>
            <li><a href="#grid">Grid</a></li>
          </ul>
        </nav>
      </header>
      <main id="home">
        <section
          aria-labelledby="flexbox-title"
          class="example-card"
          id="flexbox"
        >
          <h2 class="section-heading" id="flexbox-title">Flexbox Example</h2>
          <div class="flex-container">
            <div class="flex-item">Item 1</div>
            <div class="flex-item">Item 2</div>
            <div class="flex-item">Item 3</div>
          </div>
        </section>
        <section aria-labelledby="grid-title" class="example-card" id="grid">
          <h2 class="section-heading" id="grid-title">Grid Example</h2>
          <div class="grid-container">
            <div class="grid-item">Item A</div>
            <div class="grid-item">Item B</div>
            <div class="grid-item">Item C</div>
            <div class="grid-item">Item D</div>
          </div>
        </section>
      </main>
      <footer>
        <p>&copy; 2026 CSS Flexbox &amp; Grid Layout</p>
      </footer>
    </div>
  </body>
</html>
